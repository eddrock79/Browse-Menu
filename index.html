<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Banshee Labyrinth — Drinks Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#09080A;
    --surface:#151116;
    --surface-2:#1D171E;
    --violet:#4B2168;
    --violet-bright:#6B3593;
    --brass:#C9A15A;
    --text:#EDE7EA;
    --text-dim:#A79AA6;
    --success:#4C8C6B;
    --danger:#B5453F;
    --border:#241E27;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{font-family:'Oswald',sans-serif; letter-spacing:0.02em; text-transform:uppercase;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--violet); color:var(--text);}

  /* ---------- layout shell ---------- */
  #app{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); position:relative;}
  header.topbar{
    padding:16px 16px 0 16px;
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
  }
  .brand{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px;}
  .brand h1{font-size:19px; margin:0; line-height:1.15;}
  .brand .sub{font-size:11px; color:var(--brass); letter-spacing:0.14em; text-transform:uppercase; margin-top:3px;}
  .lock-btn{background:none; border:none; color:var(--text-dim); font-size:12px; text-decoration:underline; padding:4px 0; white-space:nowrap;}

  main{flex:1; padding:14px 16px 60px 16px;}

  /* ---------- search + spin cta ---------- */
  .toolbar{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
  input[type=text],input[type=number],textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:11px 12px; border-radius:9px; font-size:14.5px;
  }
  textarea{resize:vertical; min-height:56px;}
  .spin-cta{
    width:100%; padding:13px; border:1px solid var(--violet-bright); border-radius:10px;
    background:transparent; color:var(--text); font-family:'Oswald',sans-serif; font-size:14px;
    letter-spacing:0.05em; text-transform:uppercase;
  }
  .spin-cta:active{background:var(--violet);}

  /* ---------- category tabs ---------- */
  .cat-scroll{display:flex; gap:8px; overflow-x:auto; padding:2px 0 12px 0; -webkit-overflow-scrolling:touch;}
  .cat-scroll::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); font-size:13px; font-weight:600; white-space:nowrap;
  }
  .cat-pill.active{background:var(--brass); color:#1A1310; border-color:var(--brass);}

  /* ---------- menu items ---------- */
  .item-card{
    display:flex; justify-content:space-between; gap:12px;
    padding:14px 0; border-bottom:1px solid var(--border);
  }
  .item-card .info{flex:1; min-width:0;}
  .item-card .name{font-weight:600; font-size:15px; margin:0 0 3px 0;}
  .item-card .abv{font-size:11px; color:var(--text-dim); font-weight:500; margin-left:6px;}
  .item-card .cat-tag{font-size:10.5px; color:var(--brass); text-transform:uppercase; letter-spacing:0.05em;
    margin-left:8px; border:1px solid var(--border); border-radius:4px; padding:1px 6px;}
  .item-card .desc{font-size:12.5px; color:var(--text-dim); line-height:1.4; margin:5px 0 0 0;}
  .item-card .prices{margin-top:7px; display:flex; flex-wrap:wrap; gap:4px 14px;}
  .item-card .price{font-size:13.5px; color:var(--brass); font-weight:600;}
  .item-card .price .lbl{color:var(--text-dim); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; margin-right:4px;}
  .item-card .add-btn{
    flex:0 0 auto; width:36px; height:36px; border-radius:50%; border:1px solid var(--violet-bright);
    background:transparent; color:var(--violet-bright); font-size:19px; align-self:center;
    display:flex; align-items:center; justify-content:center;
  }
  .item-card .add-btn:active{background:var(--violet-bright); color:#fff;}
  .item-card.unavailable{opacity:0.5;}
  .item-card.unavailable .name{text-decoration:line-through;}
  .item-card.unavailable .add-btn{border-color:var(--text-dim); color:var(--text-dim);}
  .unavailable-tag{font-size:10.5px; color:var(--danger); text-transform:uppercase; letter-spacing:0.06em; font-weight:700; margin-left:8px;}
  .empty-state{color:var(--text-dim); font-size:13.5px; padding:20px 0; text-align:center; line-height:1.5;}

  /* ---------- table order bar + sheet ---------- */
  .order-bar{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; justify-content:center;}
  .order-bar-inner{
    width:100%; max-width:640px; margin:0 16px 16px 16px; background:var(--violet-bright);
    border-radius:14px; padding:13px 16px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
  }
  .order-bar-inner span{font-weight:600; font-size:14px;}
  .order-bar-inner .cta{background:#fff; color:var(--violet-bright); border:none; padding:8px 16px; border-radius:8px; font-weight:700; font-size:13px;}
  .order-line{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .order-line .oinfo{flex:1; min-width:0;}
  .order-line .oname{font-size:14px; font-weight:600;}
  .order-line .ovariant{font-size:11.5px; color:var(--text-dim);}
  .order-line .oprice{font-size:12.5px; color:var(--brass); margin-top:2px;}
  .qty-ctrl{display:flex; align-items:center; gap:8px;}
  .qty-ctrl button{width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:15px;}
  .qty-ctrl .qnum{width:18px; text-align:center; font-size:14px; font-weight:600;}
  .total-row{display:flex; justify-content:space-between; align-items:center; margin-top:16px; font-family:'Oswald',sans-serif; font-size:17px;}
  .total-row .amt{color:var(--brass);}
  .table-tag{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em;}

  /* ---------- variant quick-add ---------- */
  .variant-row{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
  .variant-row button{
    display:flex; justify-content:space-between; padding:12px 14px; border-radius:9px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:14px; font-weight:600;
  }
  .variant-row button span:last-child{color:var(--brass);}
  .variant-row button:active{border-color:var(--violet-bright);}

  /* ---------- bar kiosk screen ---------- */
  .bar-header{padding:20px 16px 4px; display:flex; justify-content:space-between; align-items:baseline;}
  .bar-header h1{font-size:20px; margin:0;}
  .bar-list{padding:8px 16px 40px;}
  .bar-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px;}
  .bar-card.fresh{border-color:var(--brass);}
  .bar-card-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .bar-card-head .tname{font-family:'Oswald',sans-serif; font-size:18px; letter-spacing:0.02em;}
  .bar-card-head .telapsed{font-size:11.5px; color:var(--text-dim);}
  .bar-line{display:flex; justify-content:space-between; font-size:14px; padding:3px 0;}
  .bar-line .bqty{color:var(--brass); font-weight:700; margin-right:6px;}
  .bar-for{color:var(--violet-bright); font-weight:600; font-size:12.5px;}
  .bar-notes{font-size:12.5px; color:var(--text-dim); font-style:italic; margin-top:8px;}
  .bar-total{display:flex; justify-content:space-between; font-family:'Oswald',sans-serif; font-size:15px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
  .bar-served-btn{width:100%; margin-top:12px; padding:11px; border-radius:9px; border:1px solid var(--success); background:transparent; color:var(--success); font-weight:600; font-size:13px;}

  /* ---------- sheet / modal ---------- */
  .sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:40;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    max-width:640px; margin:0 auto; background:var(--surface);
    border-radius:18px 18px 0 0; padding:20px 18px 24px 18px;
    max-height:85vh; overflow-y:auto; border-top:1px solid var(--border);
  }
  .sheet-handle{width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 16px auto;}
  .onboard-overlay{
    position:fixed; inset:0; z-index:55; background:var(--bg);
    display:flex; flex-direction:column; justify-content:center;
    padding:40px 26px; overflow-y:auto; max-width:640px; margin:0 auto;
  }
  .onboard-mark{font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--brass); margin-bottom:10px;}
  .onboard-overlay h2{font-size:28px; letter-spacing:0.5px; margin:0 0 26px 0; color:var(--text);}
  .onboard-overlay p{font-size:16.5px; line-height:1.7; color:var(--text); margin:0 0 22px 0;}
  .onboard-overlay p strong{color:var(--brass);}
  .onboard-overlay .btn-primary{margin-top:18px;}
  .field-label{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; margin:16px 0 6px 0; display:block;}
  .field-label:first-of-type{margin-top:0;}
  .price-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .btn-primary{
    width:100%; margin-top:14px; padding:14px; border:none; border-radius:10px;
    background:var(--violet-bright); color:#fff; font-family:'Oswald',sans-serif; font-size:15px;
    letter-spacing:0.05em; text-transform:uppercase;
  }
  .btn-secondary{
    width:100%; margin-top:10px; padding:12px; border:1px solid var(--border); border-radius:10px;
    background:transparent; color:var(--text-dim); font-size:13.5px;
  }
  .btn-danger{
    width:100%; margin-top:10px; padding:11px; border:1px solid var(--danger); border-radius:10px;
    background:transparent; color:var(--danger); font-size:13px; font-weight:600;
  }
  .btn-ghost{background:transparent; border:none; color:var(--text-dim); font-size:13px; text-decoration:underline; width:100%; text-align:center; margin-top:14px; padding:6px 0;}

  /* ---------- pin gate ---------- */
  .pin-wrap{display:flex; flex-direction:column; align-items:center; padding:60px 20px 20px 20px; text-align:center;}
  .pin-wrap p{color:var(--text-dim); font-size:13.5px; max-width:280px; margin:6px 0 22px 0;}
  .pin-dots{display:flex; gap:12px; margin-bottom:22px;}
  .pin-dot{width:14px; height:14px; border-radius:50%; border:1.5px solid var(--brass); background:transparent;}
  .pin-dot.filled{background:var(--brass);}
  .pin-pad{display:grid; grid-template-columns:repeat(3,64px); gap:14px;}
  .pin-pad button{
    width:64px; height:64px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
    color:var(--text); font-size:20px; font-weight:600;
  }
  .pin-pad button:active{background:var(--surface-2);}
  .pin-pad .clear{color:var(--danger); font-size:13px;}

  /* ---------- menu editor ---------- */
  .top-actions{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .cat-block{margin-bottom:22px;}
  .cat-block-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .cat-block-head h3{font-size:14.5px; margin:0; color:var(--brass);}
  .cat-block-head .del-cat{color:var(--danger); font-size:11.5px; background:none; border:none; text-decoration:underline;}
  .edit-item-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); gap:10px;}
  .edit-item-row .ei-name{font-size:13.5px; font-weight:600;}
  .edit-item-row .ei-price{font-size:12px; color:var(--brass);}
  .edit-item-row .ei-actions{display:flex; gap:10px; flex:0 0 auto;}
  .edit-item-row .ei-actions button{background:none; border:none; color:var(--text-dim); font-size:12px; text-decoration:underline;}
  .btn-small{padding:9px 14px; border-radius:8px; border:1px solid var(--brass); background:transparent; color:var(--brass); font-size:12.5px; font-weight:600;}
  .new-cat-row{display:flex; gap:8px; margin-top:6px;}
  .new-cat-row input{flex:1;}
  .checkbox-row{display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; color:var(--text-dim);}
  .checkbox-row input{width:auto;}

  /* ---------- wheel ---------- */
  .wheel-cat-row{display:flex; gap:8px; margin-bottom:16px;}
  .wheel-cat-row button{flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; color:var(--text-dim); font-weight:600; font-size:13.5px; padding:10px;}
  .wheel-cat-row button.active{background:var(--violet); border-color:var(--violet-bright); color:#fff;}
  .wheel-display{background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:30px 16px; text-align:center; margin-bottom:16px;}
  .wheel-display.spinning{animation:pulse .12s infinite alternate;}
  @keyframes pulse{from{opacity:1;}to{opacity:.6;}}
  .wheel-item-name{font-family:'Oswald',sans-serif; font-size:20px; letter-spacing:0.02em; text-transform:uppercase;}
  .wheel-item-desc{font-size:12.5px; color:var(--text-dim); margin-top:9px; line-height:1.5;}
  .wheel-item-price{font-size:13.5px; color:var(--brass); margin-top:8px; font-weight:600;}

  /* ---------- toast ---------- */
  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:60;
    background:var(--success); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }

  footer{text-align:center; padding:0 16px 24px 16px; font-size:11px; color:var(--text-dim);}
</style>
</head>

/* ================= DATA HELPERS ================= */
let idCounter=0;
function uid(){ return 'i'+(++idCounter); }

function mkDrinks(catId, priceLabels, rows){
  return rows.map(r=>{
    const [plu, name, abv, ...prices] = r;
    return { id: catId+'-'+uid(), plu, name, abv: abv||'', desc:'',
      prices: priceLabels.map((lbl,i)=> ({label:lbl, value: prices[i]==null?'':prices[i]})).filter(p=>p.value!=='') };
  });
}
function mkPours(catId, rows){
  return rows.map(r=>{
    const [plu, name, desc, ...prices] = r;
    const labels = prices.length>1 ? ['Glass','Pitcher'] : ['Price'];
    return { id: catId+'-'+uid(), plu, name, abv:'', desc,
      prices: labels.map((lbl,i)=>({label:lbl, value:prices[i]})) };
  });
}
function mkWine(rows){
  return rows.map(r=>{
    const [plu, name, labels, prices] = r;
    return { id: 'wine-'+uid(), plu, name, abv:'', desc:'',

}

async function loadAll(){
  try{
    const snap = await menuDocRef.get();
    if(snap.exists){ menu = JSON.parse(snap.data().json); }
    else { menu = defaultMenu(); await menuDocRef.set({ json: JSON.stringify(menu), updatedAt: Date.now() }); }
  }catch(e){ console.error(e); menu = defaultMenu(); }
  if(!activeCat && menu.categories.length){ activeCat = menu.categories[0].id; }
  loaded = true;
  if(typeof location!=='undefined' && location.hash==='#bar'){ barActive=true; startBarPolling(); }
  render();
  loadAvailability();
  setInterval(loadAvailability, 60000);
  menuDocRef.onSnapshot(snap=>{
    if(!snap.exists) return;
    const incoming = snap.data().json;
    if(incoming !== JSON.stringify(menu)){ menu = JSON.parse(incoming); render(); }
  });
}
async function saveMenu(msg){
  try{ await menuDocRef.set({ json: JSON.stringify(menu), updatedAt: Date.now() }); showToast(msg||'Saved'); }
  catch(e){ console.error(e); showToast('Could not save — check connection'); }
}

async function fetchTableOrder(slug){
  try{ const snap = await ordersCollectionRef.doc(slug).get(); return snap.exists ? snap.data() : null; }
  catch(e){ return null; }
}
async function persistTableOrder(){
  if(!tableSlug || !tableOrder) return;
  try{ await ordersCollectionRef.doc(tableSlug).set(tableOrder); }
  catch(e){ showToast('Could not sync order — check connection'); }
}
async function deleteTableOrderRemote(slug){
  try{ await ordersCollectionRef.doc(slug).delete(); }catch(e){}
}
function startTablePolling(){
  stopTablePolling();
  tablePollId = ordersCollectionRef.doc(tableSlug).onSnapshot(snap=>{
    if(!snap.exists) return;
    const fresh = snap.data();
    if(JSON.stringify(fresh)!==JSON.stringify(tableOrder)){ tableOrder = fresh; render(); }
  });
}
function stopTablePolling(){ if(tablePollId){ tablePollId(); tablePollId=null; } }

function startBarPolling(){
  stopBarPolling();
  barPollId = ordersCollectionRef.onSnapshot(snap=>{
    const out = [];
    snap.forEach(doc=> out.push(doc.data()));
    out.sort((a,b)=> (a.updatedAt||0)-(b.updatedAt||0));
    barOrders = out;
    render();
  });
}
function stopBarPolling(){ if(barPollId){ barPollId(); barPollId=null; } }

function slugify(s){ return s.trim().toLowerCase().replace(/\s+/g,' '); }

let onboardingSeen = false;
let onboardingOpen = false;
let onboardingPendingItem = null;

function openJoin(pendingItem){
  if(!onboardingSeen){
    onboardingPendingItem = pendingItem || null;
    onboardingOpen = true; render();
    return;
  }
  pendingAddItem = pendingItem || null;
  joinInput = tableLabel;
  joinSheetOpen = true; render();
}
function dismissOnboarding(){
  onboardingSeen = true;
  onboardingOpen = false;
  const item = onboardingPendingItem; onboardingPendingItem = null;
  openJoin(item);
}
function closeJoin(){ joinSheetOpen=false; pendingAddItem=null; render(); }
async function confirmJoin(){
  const label = joinInput.trim();
  if(!label){ showToast('Enter a group name'); return; }
  tableLabel = label; tableSlug = slugify(label);
  joinSheetOpen = false;
  const existing = await fetchTableOrder(tableSlug);
  tableOrder = existing || { slug: tableSlug, displayLabel: tableLabel, items: [], notes: '', updatedAt: Date.now() };
  tableOrder.slug = tableSlug;
  startTablePolling();
  render();
  if(pendingAddItem){ const it=pendingAddItem; const nm=pendingAddName; pendingAddItem=null; pendingAddName=''; requestAdd(it, nm); }
}
let generatingCode = false;
async function generateQuickCode(){
  if(generatingCode) return;
  generatingCode = true; render();
  let code, existing, attempts = 0;
  do{
    code = String(Math.floor(1000 + Math.random()*9000));
    try{ existing = await fetchTableOrder(code); }catch(e){ existing = null; }
    attempts++;
  } while(existing && attempts < 10);
  generatingCode = false;
  joinInput = code;
  await confirmJoin();
  showToast('Your code is '+code+' — share it with your group');
}
function leaveTable(){
  stopTablePolling();
  tableLabel=''; tableSlug=''; tableOrder=null; orderSheetOpen=false;
  render();
}
function requestAdd(item, forName){
  if(is86(item)){ showToast(item.name+' is currently unavailable'); return; }
  if(!tableSlug){ pendingAddName = forName||''; openJoin(item); return; }
  if(item.prices.length<=1){ addToOrder(item, item.prices[0], forName); return; }
  quickAddItem = item; quickAddName = forName||''; render();
}
function cancelQuickAdd(){ quickAddItem=null; quickAddName=''; render(); }
function chooseVariant(priceIndex){
  const item = quickAddItem; const nm = quickAddName; quickAddItem=null; quickAddName='';
  addToOrder(item, item.prices[priceIndex], nm);
}
function addToOrder(item, priceObj, forName){
  forName = (forName||'').trim();
  if(!tableOrder){ tableOrder = { slug: tableSlug, displayLabel: tableLabel, items: [], notes: '', updatedAt: Date.now() }; }
  const lineKey = item.id+'::'+priceObj.label+(forName?'::'+forName.toLowerCase():'');
  const existing = tableOrder.items.find(l=>l.lineKey===lineKey);
  if(existing){ existing.qty += 1; }
  else{
    tableOrder.items.push({ lineKey, itemId:item.id, name:item.name,
      variant: priceObj.label!=='Price' ? priceObj.label : '', price:priceObj.value, qty:1, forName });
  }
  tableOrder.updatedAt = Date.now();
  persistTableOrder();
  const cat = menu.categories.find(c=>c.items.includes(item));
  if(cat && cat.mixable){
    dashPromptItem = item; dashPromptOpen = true; render();
  } else {
    render();
    showToast('Added to '+tableLabel);
  }
}
function skipDash(){ dashPromptOpen=false; dashPromptItem=null; showToast('Added to '+tableLabel); render(); }
function addDash(plu, name){
  if(availability[plu]) { showToast(name+' is currently unavailable'); return; }
  const lineKey = 'dash::'+plu;
  const existing = tableOrder.items.find(l=>l.lineKey===lineKey);
  if(existing){ existing.qty += 1; }
  else{
    tableOrder.items.push({ lineKey, itemId:plu, name:'Dash – '+name, variant:'', price:DASH_PRICE, qty:1 });
  }
  tableOrder.updatedAt = Date.now();
  persistTableOrder();
  dashPromptOpen=false; dashPromptItem=null;
  showToast('Added to '+tableLabel);
  render();
}
function changeOrderQty(lineKey, delta){
  if(!tableOrder) return;
  const line = tableOrder.items.find(l=>l.lineKey===lineKey);
  if(!line) return;
  line.qty += delta;
  if(line.qty<=0){ tableOrder.items = tableOrder.items.filter(l=>l.lineKey!==lineKey); }
  tableOrder.updatedAt = Date.now();
  persistTableOrder(); render();
}
function setOrderNotes(v){ if(tableOrder){ tableOrder.notes=v; } }
function saveOrderNotesNow(){ if(tableOrder){ tableOrder.updatedAt=Date.now(); persistTableOrder(); } }
function orderTotal(){ return tableOrder ? tableOrder.items.reduce((s,l)=>s+l.price*l.qty,0) : 0; }
function orderCount(){ return tableOrder ? tableOrder.items.reduce((s,l)=>s+l.qty,0) : 0; }
function openOrderSheet(){ orderSheetOpen=true; render(); }
function closeOrderSheet(){ orderSheetOpen=false; render(); }
function clearOrder(){
  if(!tableOrder || !tableOrder.items.length) return;
  if(!confirm('Clear the whole order for '+tableLabel+'? This removes everything on the list.')) return;
  tableOrder.items = [];
  tableOrder.updatedAt = Date.now();
  persistTableOrder();
  showToast('Order cleared');
  render();
}

function enterBarMode(){
  location.hash = 'bar';
  barActive = true;
  startBarPolling();
  render();
}
function exitBarMode(){
  location.hash = '';
  barActive = false;
  stopBarPolling();
  render();
}
async function markServed(slug){
  await deleteTableOrderRemote(slug);
  refreshBarOrders();
}
function fmtElapsed(ts){
  const mins = Math.max(0, Math.round((Date.now()-ts)/60000));
  if(mins<1) return 'just now';
  if(mins===1) return '1 min ago';
  if(mins<60) return mins+' min ago';
  const hrs = Math.round(mins/60);
  return hrs+'h ago';
}

const AVAILABILITY_SHEET_URL = 'https://script.google.com/macros/s/AKfycbyQ3AbLUENs2cNLMFEKfp2YNkm2f5a1xl7jL2B3GoBLJFrTAPfSUI30aT-WPScYA0WswQ/exec';
let availability = {};

async function loadAvailability(){
  try{
    const res = await fetch(AVAILABILITY_SHEET_URL);
    if(!res.ok) return;
    availability = await res.json();
    render();
  }catch(e){}
}
function is86(item){ return !!(item.plu && availability[item.plu]); }

function wheelCategories(){ return menu.categories.filter(c=>c.wheel && c.items.some(i=>!is86(i))); }
function openWheel(){
  const cats = wheelCategories();
  if(!cats.length){ showToast('Add some cocktails or shooters first'); return; }
  if(!cats.find(c=>c.id===wheelCategory)) wheelCategory = cats[0].id;
  wheelOpen=true; wheelSpinning=false; wheelResultIndex=null; wheelCycleIndex=0; wheelNameInput=''; render();
}
function closeWheel(){ if(wheelSpinning) return; wheelOpen=false; render(); }
function selectWheelCategory(id){ if(wheelSpinning) return; wheelCategory=id; wheelResultIndex=null; render(); }
function spinAgain(){ wheelResultIndex=null; wheelNameInput=''; render(); }
function addFromWheel(){
  const wCat = menu.categories.find(c=>c.id===wheelCategory);
  const items = wCat ? wCat.items.filter(i=>!is86(i)) : [];
  const item = items[wheelResultIndex];
  if(!item) return;
  const nm = wheelNameInput;
  wheelOpen = false;
  wheelNameInput = '';
  requestAdd(item, nm);
}
function spinWheel(){
  if(wheelSpinning) return;
  const cat = menu.categories.find(c=>c.id===wheelCategory);
  const items = cat ? cat.items.filter(i=>!is86(i)) : [];
  if(!items.length) return;
  wheelSpinning=true; wheelResultIndex=null;
  const finalIndex = Math.floor(Math.random()*items.length);
  const totalTicks = 18; let tick=0;
  function step(){
    wheelCycleIndex = Math.floor(Math.random()*items.length);
    render(); tick++;
    if(tick<totalTicks){ const progress=tick/totalTicks; setTimeout(step, 55+Math.pow(progress,2)*260); }
    else { wheelCycleIndex=finalIndex; wheelResultIndex=finalIndex; wheelSpinning=false; render(); }
  }
  step();
}

function selectCat(id){ activeCat=id; query=''; render(); }
function findItemById(id){
  for(const cat of menu.categories){
    const item = cat.items.find(i=>i.id===id);
    if(item) return item;
  }
  return null;
}
function searchAllItems(q){
  q = q.trim().toLowerCase();
  const results = [];
  menu.categories.forEach(cat=>{
    cat.items.forEach(item=>{
      if(item.name.toLowerCase().includes(q) || (item.desc||'').toLowerCase().includes(q)){
        results.push({ item, catName: cat.name });
      }
    });
  });
  return results;
}
function priceLineHtml(item){
  return item.prices.map(p=>`<span class="price">${p.label!=='Price'?`<span class="lbl">${escapeHtml(p.label)}</span>`:''}${money(p.value)}</span>`).join('');
}
function itemCardHtml(it, catName){
  const unavailable = is86(it);
  return `<div class="item-card ${unavailable?'unavailable':''}">
    <div class="info">
      <p class="name">${escapeHtml(it.name)}${it.abv?`<span class="abv">${escapeHtml(it.abv)}</span>`:''}${catName?`<span class="cat-tag">${escapeHtml(catName)}</span>`:''}${unavailable?'<span class="unavailable-tag">86\'d</span>':''}</p>
      ${it.desc ? `<p class="desc">${escapeHtml(it.desc)}</p>` : ''}
      <div class="prices">${priceLineHtml(it)}</div>
    </div>
    <button class="add-btn" ${unavailable?'disabled':''} onclick="requestAdd(findItemById('${it.id}'))">+</button>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  if(!loaded){ app.innerHTML = '<div style="padding:60px 20px; text-align:center; color:#A79AA6;">Loading menu…</div>'; return; }
  if(barActive){ app.innerHTML = renderBarScreen(); return; }

  const prevCatScroll = document.querySelector('.cat-scroll');
  const catScrollX = prevCatScroll ? prevCatScroll.scrollLeft : 0;
  const prevSearchInput = document.getElementById('search-input');
  const searchFocused = !!(prevSearchInput && document.activeElement === prevSearchInput);
  const searchSelStart = searchFocused ? prevSearchInput.selectionStart : null;
  const searchSelEnd = searchFocused ? prevSearchInput.selectionEnd : null;

  let html = '';
  html += toastMsg ? `<div class="toast">${escapeHtml(toastMsg)}</div>` : '';
  html += `<header class="topbar">
    <div class="brand">
      <div>
        <h1>The Banshee Labyrinth</h1>
        <div class="sub">Drinks Menu</div>
      </div>
      <button class="lock-btn" onclick="${mode==='edit'?'lockEdit()':"setMode('edit')"}">${mode==='edit'?'Done editing':'Edit menu'}</button>
    </div>
  </header>`;

  html += '<main>';
  html += mode==='browse' ? renderBrowseView() : renderEditView();
  html += '</main>';

  if(mode==='browse' && tableOrder && tableOrder.items.length && !orderSheetOpen){
    html += `<div class="order-bar"><div class="order-bar-inner" onclick="openOrderSheet()">
      <span>${escapeHtml(tableLabel)} · ${orderCount()} item${orderCount()!==1?'s':''} · ${money(orderTotal())}</span>
      <button class="cta" onclick="event.stopPropagation(); openOrderSheet()">View order</button>
    </div></div>`;
  }

  html += `<footer>Menu synced across devices · staff edits require the master PIN · <a href="#bar" onclick="enterBarMode(); return false;" style="color:var(--text-dim);">Bar orders screen</a></footer>`;

  if(wheelOpen){ html += renderWheelSheet(); }
  if(itemSheetOpen){ html += renderItemSheet(); }
  if(onboardingOpen){ html += renderOnboardingSheet(); }
  if(joinSheetOpen){ html += renderJoinSheet(); }
  if(quickAddItem){ html += renderQuickAddSheet(); }
  if(orderSheetOpen){ html += renderOrderSheet(); }
  if(dashPromptOpen && dashPromptItem){ html += renderDashSheet(); }

  app.innerHTML = html;

  const newCatScroll = document.querySelector('.cat-scroll');
  if(newCatScroll && catScrollX){ newCatScroll.scrollLeft = catScrollX; }
  if(searchFocused){
    const newSearchInput = document.getElementById('search-input');
    if(newSearchInput){
      newSearchInput.focus();
      if(searchSelStart != null && typeof newSearchInput.setSelectionRange === 'function'){
        try{ newSearchInput.setSelectionRange(searchSelStart, searchSelEnd); }catch(e){}
      }
    }
  }
}

function renderBrowseView(){
  if(!menu.categories.length){ return '<div class="empty-state">No menu items yet.</div>'; }
  let h = `<div class="toolbar">
    <input type="text" id="search-input" placeholder="Search the menu…" value="${escapeHtml(query)}" oninput="query=this.value; render()">
    <button class="spin-cta" onclick="openWheel()">Can't Decide? Spin for a Cocktail or Shooter</button>
    ${tableSlug
      ? `<div class="table-tag">Ordering for ${escapeHtml(tableLabel)} · <a href="#" onclick="leaveTable(); return false;" style="color:var(--text-dim);">change group</a></div>`
      : `<button class="btn-secondary" style="margin-top:0;" onclick="openJoin()">Start a group order</button>`}
  </div>`;

  h += '<div class="cat-scroll">';
  menu.categories.forEach(c=>{
    h += `<button class="cat-pill ${activeCat===c.id && !query.trim()?'active':''}" onclick="selectCat('${c.id}')">${escapeHtml(c.name)}</button>`;
  });
  h += '</div>';

  if(query.trim()){
    const results = searchAllItems(query);
    if(!results.length) h += `<div class="empty-state">Nothing matches your search.</div>`;
    else results.forEach(({item,catName})=>{ h += itemCardHtml(item,catName); });
  } else {
    const cat = menu.categories.find(c=>c.id===activeCat) || menu.categories[0];
    const items = cat ? cat.items : [];
    if(!items.length) h += `<div class="empty-state">Nothing in ${escapeHtml(cat.name)} yet.</div>`;
    else items.forEach(it=>{ h += itemCardHtml(it); });
  }
  return h;
}

function renderEditView(){
  if(!editAuthed){
    let dots = '';
    for(let i=0;i<4;i++){ dots += `<div class="pin-dot ${i<pinEntry.length?'filled':''}"></div>`; }
    let pad = '';
    for(let n=1;n<=9;n++){ pad += `<button onclick="tryPinDigit(${n})">${n}</button>`; }
    pad += `<button class="clear" onclick="pinClear()">Clear</button>`;
    pad += `<button onclick="tryPinDigit(0)">0</button>`;
    pad += `<span></span>`;
    return `<div class="pin-wrap">
      <h2 style="font-size:16px; margin:0;">Staff Access</h2>
      <p>Enter the master PIN to edit the menu.</p>
      <div class="pin-dots">${dots}</div>
      <div class="pin-pad">${pad}</div>
    </div>`;
  }

  let h = '';
  menu.categories.forEach(cat=>{
    h += `<div class="cat-block">
      <div class="cat-block-head">
        <h3>${escapeHtml(cat.name)}${cat.wheel?' · in wheel':''}</h3>
        <button class="del-cat" onclick="removeCategory('${cat.id}')">Remove category</button>
      </div>`;
    if(cat.items.length===0) h += `<div class="empty-state" style="padding:8px 0; text-align:left;">No items yet.</div>`;
    else cat.items.forEach(it=>{
      h += `<div class="edit-item-row">
        <div>
          <div class="ei-name">${escapeHtml(it.name)}</div>
          <div class="ei-price">${it.prices.map(p=>money(p.value)).join(' · ')}</div>
        </div>
        <div class="ei-actions">
          <button onclick="openEditItem('${cat.id}','${it.id}')">Edit</button>
          <button onclick="removeItem('${cat.id}','${it.id}')">Remove</button>
        </div>
      </div>`;
    });
    h += `<button class="btn-small" style="margin-top:8px;" onclick="openAddItem('${cat.id}')">+ Add item</button></div>`;
  });

  h += `<div class="cat-block">
    <label class="field-label" style="margin-top:0;">Add a new category</label>
    <div class="new-cat-row">
      <input type="text" placeholder="e.g. Seasonal Specials" value="${escapeHtml(newCatName)}" oninput="newCatName=this.value">
      <button class="btn-small" onclick="addCategory()">Add</button>
    </div>
    <label class="checkbox-row"><input type="checkbox" id="newCatWheelCb" ${newCatWheel?'checked':''} onchange="newCatWheel=this.checked"> Include in the "Can't Decide?" wheel</label>
  </div>`;
  return h;
}

function renderItemSheet(){
  const d = itemSheetDraft;
  let h = `<div class="sheet-backdrop" onclick="closeItemSheet()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 style="font-size:16px; margin:0 0 4px 0;">${itemSheetMode==='add'?'Add item':'Edit item'}</h2>
    <label class="field-label">Name</label>
    <input type="text" value="${escapeHtml(d.name)}" oninput="draftSetField('name',this.value)">
    <label class="field-label">ABV (optional)</label>
    <input type="text" placeholder="e.g. 40.0%" value="${escapeHtml(d.abv)}" oninput="draftSetField('abv',this.value)">`;
  const cat = menu.categories.find(c=>c.id===itemSheetCatId);
  if((cat && cat.wheel) || d.desc){
    h += `<label class="field-label">Ingredients / description</label>
    <textarea oninput="draftSetField('desc',this.value)">${escapeHtml(d.desc)}</textarea>`;
  }
  h += `<label class="field-label">Prices</label><div class="price-grid">`;
  d.prices.forEach((p,i)=>{
    h += `<div><label class="field-label" style="margin-top:0;">${escapeHtml(p.label)}</label>
      <input type="number" step="0.05" value="${p.value}" oninput="draftSetPrice(${i},this.value)"></div>`;
  });
  h += `</div>
    <button class="btn-primary" onclick="saveItemDraft()">${itemSheetMode==='add'?'Add item':'Save changes'}</button>
    <button class="btn-ghost" onclick="closeItemSheet()">Cancel</button>
  </div>`;
  return h;
}

function renderWheelSheet(){
  const cats = wheelCategories();
  const wCat = menu.categories.find(c=>c.id===wheelCategory);
  const wItems = wCat ? wCat.items.filter(i=>!is86(i)) : [];
  const displayIndex = wheelResultIndex!=null ? wheelResultIndex : wheelCycleIndex;
  const displayItem = wItems[displayIndex] || null;
  const landed = wheelResultIndex !== null;

  let h = `<div class="sheet-backdrop" onclick="closeWheel()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 style="font-size:16px; margin:0 0 4px 0;">Can't Decide?</h2>
    <p style="font-size:12.5px; color:var(--text-dim); margin:0 0 14px 0;">Spin for a random cocktail or shooter.</p>`;

  if(!wheelSpinning && !landed){
    h += `<div class="wheel-cat-row">`;
    cats.forEach(c=>{ h += `<button class="${wheelCategory===c.id?'active':''}" onclick="selectWheelCategory('${c.id}')">${escapeHtml(c.name)}</button>`; });
    h += `</div>`;
  }

  h += `<div class="wheel-display ${wheelSpinning?'spinning':''}">
    <div class="wheel-item-name">${displayItem?escapeHtml(displayItem.name):'—'}</div>
    ${landed && displayItem ? `<div class="wheel-item-desc">${escapeHtml(displayItem.desc||'')}</div>
    <div class="wheel-item-price">${displayItem.prices.map(p=>`${p.label} ${money(p.value)}`).join(' · ')}</div>` : ''}
  </div>`;

  if(!landed) h += `<button class="btn-primary" onclick="spinWheel()" ${wheelSpinning?'disabled':''}>${wheelSpinning?'Spinning…':'Spin'}</button>`;
  else {
    h += `<label class="field-label">Whose is this? (optional)</label>
    <input type="text" placeholder="e.g. Sarah" value="${escapeHtml(wheelNameInput)}" oninput="wheelNameInput=this.value">
    <button class="btn-primary" onclick="addFromWheel()">Add to order</button>
    <button class="btn-secondary" onclick="spinAgain()">Spin again</button>`;
  }
  h += `<button class="btn-ghost" onclick="closeWheel()" ${wheelSpinning?'disabled':''}>Close</button></div>`;
  return h;
}

/* ONLY CUSTOMER-FACING CHANGE FROM Banshee-Order */
function renderOnboardingSheet(){
  return `<div class="onboard-overlay">
    <div class="onboard-mark">The Banshee Labyrinth</div>
    <h2>Browse Our Drinks Menu</h2>
    <p><strong>There's no payment or checkout here.</strong> When you're ready, simply use your list when ordering at the bar.</p>
    <p>Browse our full drinks menu and check prices.</p>
    <p><strong>Save drinks to your list</strong> as you browse — perfect for remembering your choices or putting together a round.</p>
    <p>With friends? Share a group name or 4-digit code and everyone can add to the same list.</p>
    <button class="btn-primary" onclick="dismissOnboarding()">View Drinks Menu</button>
  </div>`;
}

function renderJoinSheet(){
  return `<div class="sheet-backdrop" onclick="closeJoin()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 style="font-size:16px; margin:0 0 4px 0;">What's your group called?</h2>
    <p style="font-size:12.5px; color:var(--text-dim); margin:0 0 4px 0;">
      Everyone who enters the same group name shares one order list — type exactly
      what everyone else in your group will type.
    </p>
    <label class="field-label">Group name</label>
    <input type="text" placeholder="e.g. Banshee 209" value="${escapeHtml(joinInput)}"
      oninput="joinInput=this.value" onkeydown="if(event.key==='Enter')confirmJoin()">
    <button class="btn-primary" onclick="confirmJoin()">Start ordering</button>
    <p style="font-size:12px; color:var(--text-dim); text-align:center; margin:16px 0 2px 0;">— or —</p>
    <button class="btn-secondary" ${generatingCode?'disabled':''} onclick="generateQuickCode()">
      ${generatingCode?'Finding you a code…':'Get a quick 4-digit code instead'}
    </button>
    <button class="btn-ghost" onclick="closeJoin()">Cancel</button>
  </div>`;
}

function renderQuickAddSheet(){
  const item = quickAddItem;
  let h = `<div class="sheet-backdrop" onclick="cancelQuickAdd()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 style="font-size:16px; margin:0 0 4px 0;">${escapeHtml(item.name)}</h2>
    <p style="font-size:12.5px; color:var(--text-dim); margin:0 0 12px 0;">Which one?</p>
    <div class="variant-row">`;
  item.prices.forEach((p,i)=>{
    h += `<button onclick="chooseVariant(${i})"><span>${escapeHtml(p.label)}</span><span>${money(p.value)}</span></button>`;
  });
  h += `</div><button class="btn-ghost" onclick="cancelQuickAdd()">Cancel</button></div>`;
  return h;
}

function renderOrderSheet(){
  let h = `<div class="sheet-backdrop" onclick="closeOrderSheet()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 style="font-size:16px; margin:0 0 12px 0;">${escapeHtml(tableLabel)}'s Order</h2>`;
  if(!tableOrder || !tableOrder.items.length){
    h += `<div class="empty-state">Nothing added yet.</div>`;
  } else {
    tableOrder.items.forEach(l=>{
      h += `<div class="order-line">
        <div class="oinfo">
          <div class="oname">${escapeHtml(l.name)}${l.variant?`<span class="ovariant"> · ${escapeHtml(l.variant)}</span>`:''}${l.forName?` <span class="ovariant">· for ${escapeHtml(l.forName)}</span>`:''}</div>
          <div class="oprice">${money(l.price)} each</div>
        </div>
        <div class="qty-ctrl">
          <button onclick="changeOrderQty('${l.lineKey}',-1)">−</button>
          <span class="qnum">${l.qty}</span>
          <button onclick="changeOrderQty('${l.lineKey}',1)">+</button>
        </div>
      </div>`;
    });
    h += `<label class="field-label">Notes for the bar (optional)</label>
    <textarea placeholder="Allergies, no ice, etc." oninput="setOrderNotes(this.value)" onblur="saveOrderNotesNow()">${escapeHtml(tableOrder.notes||'')}</textarea>
    <div class="total-row"><span>Total</span><span class="amt">${money(orderTotal())}</span></div>
    <p style="font-size:12px; color:var(--text-dim); margin-top:10px; line-height:1.5;">
      This list is already visible on the bar's Orders screen — just bring it up
      when you get there.
    </p>
    <button class="btn-danger" onclick="clearOrder()">Clear whole order</button>`;
  }
  h += `<button class="btn-secondary" onclick="closeOrderSheet()">Keep browsing</button></div>`;
  return h;
}

function renderDashSheet(){
  const item = dashPromptItem;
  let h = `<div class="sheet-backdrop" onclick="skipDash()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 style="font-size:16px; margin:0 0 4px 0;">Add a mixer?</h2>
    <p style="font-size:12.5px; color:var(--text-dim); margin:0 0 12px 0;">
      ${escapeHtml(item.name)} is charged neat — a dash of mixer is ${money(DASH_PRICE)} on top, rung up separately.
    </p>
    <div class="variant-row">`;
  DASH_OPTIONS.forEach(d=>{
    const out = !!availability[d.plu];
    h += `<button ${out?'disabled style="opacity:0.5;"':''} onclick="addDash('${d.plu}','${escapeHtml(d.name)}')"><span>${escapeHtml(d.name)}${out?' (unavailable)':''}</span><span>${money(DASH_PRICE)}</span></button>`;
  });
  h += `</div><button class="btn-ghost" onclick="skipDash()">No mixer, just the spirit</button></div>`;
  return h;
}

function renderBarScreen(){
  let h = `<div class="bar-header">
    <h1>Bar Orders</h1>
    <a href="#" onclick="exitBarMode(); return false;" style="color:var(--text-dim); font-size:12px; text-decoration:underline;">Back to menu</a>
  </div>
  <div class="bar-list">`;
  if(!barOrders.length){
    h += `<div class="empty-state">No active group orders.</div>`;
  } else {
    barOrders.forEach(o=>{
      const fresh = (Date.now()-o.updatedAt) < 60000;
      const total = o.items.reduce((s,l)=>s+l.price*l.qty,0);
      h += `<div class="bar-card ${fresh?'fresh':''}">
        <div class="bar-card-head">
          <span class="tname">${escapeHtml(o.displayLabel)}</span>
          <span class="telapsed">${fresh?'Updated just now':'Updated '+fmtElapsed(o.updatedAt)}</span>
        </div>`;
      o.items.forEach(l=>{
        h += `<div class="bar-line"><span><span class="bqty">${l.qty}×</span>${escapeHtml(l.name)}${l.variant?' — '+escapeHtml(l.variant):''}${l.forName?' <span class="bar-for">for '+escapeHtml(l.forName)+'</span>':''}</span><span>${money(l.price*l.qty)}</span></div>`;
      });
      if(o.notes){ h += `<div class="bar-notes">Note: ${escapeHtml(o.notes)}</div>`; }
      h += `<div class="bar-total"><span>Total</span><span>${money(total)}</span></div>
        <button class="bar-served-btn" onclick="markServed('${o.slug || slugify(o.displayLabel)}')">Mark served / clear</button>
      </div>`;
    });
  }
  h += `</div>`;
  return h;
}

loadAll();

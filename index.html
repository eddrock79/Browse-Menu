<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Banshee Labyrinth — Drinks Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/gqs7riy.css">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
/*
 * Customer QR access window
 *
 * The printed QR opens the clean address: https://menu.hauntedpubs.co.uk/
 * A clean visit starts (or restarts) a two-hour window. We then add an
 * internal marker to the address so refreshing the page does not reset it.
 * Scanning the printed QR again opens the clean address and starts a fresh
 * two-hour window. The staff #bar screen is deliberately excluded.
 */
(function(){
  const ACCESS_DURATION_MS = 2 * 60 * 60 * 1000;
  const REDIRECT_URL = 'https://www.thebansheelabyrinth.com/';
  const ACCESS_KEY = 'banshee-menu-access-until-v1';
  const VISIT_MARKER = 'menu_access';
  let expiryTimer = null;
  let memoryExpiry = 0;

  function isBarScreen(){
    return window.location.hash === '#bar';
  }

  function redirectToWebsite(){
    window.location.replace(REDIRECT_URL);
  }

  function readExpiry(){
    try{
      const value = Number(window.localStorage.getItem(ACCESS_KEY));
      return Number.isFinite(value) && value > 0 ? value : memoryExpiry;
    }catch(error){
      return memoryExpiry;
    }
  }

  function saveExpiry(value){
    try{
      window.localStorage.setItem(ACCESS_KEY, String(value));
      return true;
    }catch(error){
      memoryExpiry = value;
      return false;
    }
  }

  function markVisit(){
    const url = new URL(window.location.href);
    url.searchParams.set(VISIT_MARKER, 'active');
    window.history.replaceState(null, '', url.pathname + url.search + url.hash);
  }

  function scheduleExpiry(){
    if(expiryTimer){
      window.clearTimeout(expiryTimer);
      expiryTimer = null;
    }
    if(isBarScreen()) return;

    const remaining = readExpiry() - Date.now();
    if(remaining <= 0){
      redirectToWebsite();
      return;
    }

    // Recheck periodically so returning to a suspended mobile tab still
    // redirects promptly once its two-hour window has ended.
    expiryTimer = window.setTimeout(scheduleExpiry, Math.min(remaining, 30000));
  }

  function initialiseQrAccess(){
    if(isBarScreen()) return;

    const url = new URL(window.location.href);
    const isFreshQrVisit = !url.searchParams.has(VISIT_MARKER);

    if(isFreshQrVisit){
      const expiresAt = Date.now() + ACCESS_DURATION_MS;
      if(!saveExpiry(expiresAt)){
        // Storage is unavailable: keep the expiry in the marked URL so the
        // current open page can still honour the two-hour countdown.
        url.searchParams.set(VISIT_MARKER, String(expiresAt));
        window.history.replaceState(null, '', url.pathname + url.search + url.hash);
      }else{
        markVisit();
      }
    }else if(!readExpiry()){
      const fallbackExpiry = Number(url.searchParams.get(VISIT_MARKER));
      if(!Number.isFinite(fallbackExpiry) || fallbackExpiry <= Date.now()){
        redirectToWebsite();
        return;
      }
      expiryTimer = window.setTimeout(redirectToWebsite, fallbackExpiry - Date.now());
      return;
    }

    scheduleExpiry();
  }

  window.addEventListener('hashchange', scheduleExpiry);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) scheduleExpiry();
  });

  initialiseQrAccess();
})();
</script>
<style>
  :root{
    --bg:#09080A;
    --surface:#151116;
    --surface-2:#1D171E;
    --violet:#4B2168;
    --violet-bright:#6B3593;
    --brass:#C9A15A;
    --text:#EDE7EA;
    --text-dim:#A79AA6;
    --success:#4C8C6B;
    --danger:#B5453F;
    --border:#241E27;
    --site-purple:#662D91;
    --site-green:#96BD0D;
    --saw-red:#A51F28;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{font-family:'Oswald',sans-serif; letter-spacing:0.02em; text-transform:uppercase;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--violet); color:var(--text);}

  /* ---------- layout shell ---------- */
  #app{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); position:relative;}
  header.topbar{
    padding:10px 16px 0 16px;
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
  }
  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:8px;
    position:relative;
  }
  .brand-logo{
    display:block;
    width:min(270px, 72vw);
    max-height:104px;
    object-fit:contain;
    object-position:center center;
    margin:0 auto;
  }
  .lock-btn{background:none; border:none; color:var(--text-dim); font-size:12px; text-decoration:underline; padding:4px 0; white-space:nowrap;}

  main{flex:1; padding:6px 16px 60px 16px;}

  /* ---------- search + spin cta ---------- */
  .toolbar{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
  input[type=text],input[type=number],textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:11px 12px; border-radius:9px; font-size:14.5px;
  }
  #search-input{
    border-color:rgba(255,255,255,0.78);
    background:#121014;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  #search-input:focus{
    outline:none;
    border-color:#fff;
    box-shadow:0 0 0 2px rgba(150,189,13,0.18);
  }
  #search-input::placeholder{color:#B9AFB8;}
  textarea{resize:vertical; min-height:56px;}
  .spin-cta{
    position:relative; overflow:hidden; width:100%; min-height:62px; padding:10px 13px;
    display:grid; grid-template-columns:minmax(0,1fr) 18px; align-items:center; gap:12px;
    border:1px solid rgba(165,31,40,0.88); border-radius:3px; text-align:left;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 4px),
      linear-gradient(105deg, #090909, #171011 62%, #23090C);
    color:var(--text); box-shadow:inset 4px 0 0 var(--saw-red);
  }
  .spin-cta:active{background:#270A0D;}
  .spin-copy{display:block; min-width:0;}
  .spin-title{
    display:block; font-family:'Oswald',sans-serif; font-size:16px; font-weight:600;
    line-height:1.08; letter-spacing:0.085em; text-transform:uppercase;
  }
  .spin-sub{display:block; margin-top:4px; color:#B9A7A9; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase;}
  .spin-arrow{color:#D65059; font-size:24px; line-height:1; text-align:right;}

  .group-order-hero{
    width:100%;
    min-height:72px;
    padding:14px 16px;
    border:1px solid rgba(150,189,13,0.82);
    border-radius:4px;
    background:
      radial-gradient(circle at 28% 50%, rgba(102,45,145,0.52), transparent 44%),
      linear-gradient(110deg, #180B21 0%, #2A0E36 54%, #100A16 100%);
    box-shadow:inset 0 0 28px rgba(102,45,145,0.18);
    color:var(--text);
    text-align:center;
  }
  .group-order-hero:active{background:#24102F;}
  .group-order-hero .group-title{
    display:block;
    font-family:'gamay-narrow','Oswald',sans-serif;
    color:var(--site-green);
    font-size:17px;
    font-weight:600;
    letter-spacing:0.10em;
    text-transform:uppercase;
    line-height:1.1;
  }
  .group-order-hero .group-sub{
    display:block;
    margin-top:6px;
    color:#C9C0C9;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }

  /* ---------- category tabs ---------- */
  .cat-scroll{display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px 0; -webkit-overflow-scrolling:touch;}
  .cat-scroll::-webkit-scrollbar{display:none;}
  @media (hover:hover) and (pointer:fine){
    .cat-scroll{scrollbar-width:thin; scrollbar-color:var(--border) transparent;}
    .cat-scroll::-webkit-scrollbar{display:block; height:6px;}
    .cat-scroll::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px;}
    .cat-scroll::-webkit-scrollbar-thumb:hover{background:var(--text-dim);}
    .cat-scroll::-webkit-scrollbar-track{background:transparent;}
  }
  .cat-pill{
    flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); font-size:13px; font-weight:600; white-space:nowrap;
  }
  .cat-pill.active{background:var(--brass); color:#1A1310; border-color:var(--brass);}

  /* ---------- menu items ---------- */
  .item-card{
    display:flex; justify-content:space-between; gap:12px;
    padding:14px 0; border-bottom:1px solid var(--border);
  }
  .item-card .info{flex:1; min-width:0;}
  .item-card .name{font-weight:600; font-size:15px; margin:0 0 3px 0;}
  .item-card .abv{font-size:11px; color:var(--text-dim); font-weight:500; margin-left:6px;}
  .item-card .cat-tag{font-size:10.5px; color:var(--brass); text-transform:uppercase; letter-spacing:0.05em;
    margin-left:8px; border:1px solid var(--border); border-radius:4px; padding:1px 6px;}
  .item-card .desc{font-size:12.5px; color:var(--text-dim); line-height:1.4; margin:5px 0 0 0;}
  .item-card .prices{margin-top:7px; display:flex; flex-wrap:wrap; gap:4px 14px;}
  .item-card .price{font-size:13.5px; color:var(--brass); font-weight:600;}
  .item-card .price .lbl{color:var(--text-dim); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; margin-right:4px;}
  .item-card .add-btn{
    flex:0 0 auto; width:36px; height:36px; border-radius:50%; border:1px solid var(--violet-bright);
    background:transparent; color:var(--violet-bright); font-size:19px; align-self:center;
    display:flex; align-items:center; justify-content:center;
  }
  .item-card .add-btn:active{background:var(--violet-bright); color:#fff;}
  .item-card.unavailable{opacity:0.5;}
  .item-card.unavailable .name{text-decoration:line-through;}
  .item-card.unavailable .add-btn{border-color:var(--text-dim); color:var(--text-dim);}
  .unavailable-tag{font-size:10.5px; color:var(--danger); text-transform:uppercase; letter-spacing:0.06em; font-weight:700; margin-left:8px;}
  .empty-state{color:var(--text-dim); font-size:13.5px; padding:20px 0; text-align:center; line-height:1.5;}

  /* ---------- table order bar + sheet ---------- */
  .order-bar{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; justify-content:center;}
  .order-bar-inner{
    width:100%; max-width:640px; margin:0 16px 16px 16px; background:var(--violet-bright);
    border-radius:14px; padding:13px 16px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
  }
  .order-bar-inner span{font-weight:600; font-size:14px;}
  .order-bar-inner .cta{background:#fff; color:var(--violet-bright); border:none; padding:8px 16px; border-radius:8px; font-weight:700; font-size:13px;}
  .order-line{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .order-line .oinfo{flex:1; min-width:0;}
  .order-line .oname{font-size:14px; font-weight:600;}
  .order-line .ovariant{font-size:11.5px; color:var(--text-dim);}
  .order-line .oprice{font-size:12.5px; color:var(--brass); margin-top:2px;}
  .qty-ctrl{display:flex; align-items:center; gap:8px;}
  .qty-ctrl button{width:26px; height:26px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:15px;}
  .qty-ctrl .qnum{width:18px; text-align:center; font-size:14px; font-weight:600;}
  .total-row{display:flex; justify-content:space-between; align-items:center; margin-top:16px; font-family:'Oswald',sans-serif; font-size:17px;}
  .total-row .amt{color:var(--brass);}
  .table-tag{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em;}

  /* ---------- variant quick-add ---------- */
  .variant-row{display:flex; flex-direction:column; gap:8px; margin-top:4px;}
  .variant-row button{
    display:flex; justify-content:space-between; padding:12px 14px; border-radius:9px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:14px; font-weight:600;
  }
  .variant-row button span:last-child{color:var(--brass);}
  .variant-row button:active{border-color:var(--violet-bright);}

  /* ---------- bar kiosk screen (full-screen iPad-style grid) ---------- */
  .bar-shell{position:fixed; top:0; left:0; right:0; bottom:0; z-index:40; background:var(--bg); display:flex; flex-direction:column;}
  .bar-topbar{flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:1px solid var(--border); background:var(--surface);}
  .bar-topbar h1{font-size:19px; margin:0; letter-spacing:0.04em;}
  .bar-topbar .bar-count{color:var(--brass); font-family:'Inter',sans-serif; font-weight:600; letter-spacing:0;}
  .bar-topbar .bar-exit{color:var(--text-dim); font-size:12.5px; text-decoration:underline;}

  /* 4-wide grid; each tile is 1/16 of the screen while <=16 orders are active,
     and rows keep the same square-ish size and simply scroll beyond that. */
  .bar-grid{
    flex:1 1 auto; min-height:0; overflow-y:auto;
    display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:minmax(22vh,1fr);
    gap:1px; background:var(--border);
  }
  .bar-tile{
    border:none; background:var(--surface); color:var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    padding:10px; position:relative; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .bar-tile:active{background:var(--surface-2);}
  .bar-tile.fresh{box-shadow:inset 0 0 0 3px var(--brass);}
  .bar-tile .btname{font-family:'Oswald',sans-serif; font-size:clamp(17px,2.6vw,30px); text-transform:uppercase; letter-spacing:0.03em; text-align:center; line-height:1.1; word-break:break-word;}
  .bar-tile .btcount{font-size:11.5px; color:var(--text-dim); text-align:center;}
  .bar-tile .btdot{position:absolute; top:12px; right:12px; width:10px; height:10px; border-radius:50%; background:var(--brass); box-shadow:0 0 8px var(--brass);}
  .bar-tile.empty{background:var(--bg); cursor:default;}

  /* drill-down order detail, replaces the grid full-screen */
  .bar-detail-body{flex:1 1 auto; min-height:0; overflow-y:auto; padding:20px 22px 12px; max-width:520px; margin:0 auto; width:100%;}
  .bar-line{display:flex; justify-content:space-between; font-size:16px; padding:7px 0; border-bottom:1px solid var(--border);}
  .bar-line .bqty{color:var(--brass); font-weight:700; margin-right:6px;}
  .bar-for{color:var(--violet-bright); font-weight:600; font-size:13px;}
  .bar-notes{font-size:13.5px; color:var(--text-dim); font-style:italic; margin-top:10px;}
  .bar-total{display:flex; justify-content:space-between; font-family:'Oswald',sans-serif; font-size:19px; margin-top:14px; padding-top:14px; border-top:1px dashed var(--border);}
  .bar-print-head{display:none;}
  .bar-detail-actions{flex:0 0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border-top:1px solid var(--border);}
  .bar-action-btn{border:none; padding:20px 10px; font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:0.04em; text-transform:uppercase;}
  .bar-action-print{background:var(--surface); color:var(--text);}
  .bar-action-clear{background:var(--surface); color:var(--success);}
  .bar-action-return{background:var(--surface); color:var(--text-dim);}
  .bar-action-btn:active{background:var(--surface-2);}

  /* printing an individual order: hide everything else on the page */
  @media print{
    body *{visibility:hidden;}
    .bar-print-area, .bar-print-area *{visibility:visible;}
    .bar-print-area{position:absolute; top:0; left:0; width:100%; padding:0; margin:0; color:#000; background:#fff;}
    .bar-print-area .bar-print-head{display:block; margin-bottom:10px;}
    .bar-print-area .bar-print-title{font-family:'Oswald',sans-serif; font-size:22px; text-transform:uppercase;}
    .bar-print-area .bar-print-time{font-size:12px; color:#444;}
    .bar-print-area .bar-line, .bar-print-area .bar-total{color:#000; border-color:#999;}
    .bar-print-area .bqty{color:#000;}
  }

  /* ---------- customer-facing "go to bar" full-screen confirmation ---------- */
  .sent-shell{
    position:fixed; top:0; left:0; right:0; bottom:0; z-index:50;
    background:var(--bg); display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:40px 24px; overflow-y:auto;
  }
  .sent-check{
    width:60px; height:60px; border-radius:50%; border:2px solid var(--success);
    color:var(--success); font-size:30px; display:flex; align-items:center;
    justify-content:center; margin-bottom:22px; flex:0 0 auto;
  }
  .sent-eyebrow{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.14em; color:var(--text-dim); font-size:12.5px; margin:0 0 10px 0;}
  .sent-instruction{
    font-size:clamp(24px,6.5vw,30px); font-weight:700; color:var(--text);
    margin:0 0 26px 0; line-height:1.2; max-width:360px; padding:0 8px;
  }
  .sent-groupname{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.02em;
    font-size:clamp(38px,13vw,76px); line-height:1.05; color:var(--brass);
    margin:0 0 24px 0; overflow-wrap:break-word; max-width:100%;
  }
  .sent-sub{font-size:13px; color:var(--text-dim); margin:0 0 20px 0;}
  .sent-breakdown{width:100%; max-width:380px; margin:0 0 28px 0; text-align:left; border-top:1px solid var(--border); padding-top:14px;}
  .sent-item-line{display:flex; justify-content:space-between; gap:10px; font-size:14.5px; padding:6px 0; color:var(--text); border-bottom:1px solid var(--border);}
  .sent-item-line .sqty{color:var(--brass); font-weight:700;}
  .sent-item-line .sfor{color:var(--violet-bright); font-weight:600; font-size:12.5px;}
  .sent-item-note{font-size:12.5px; color:var(--text-dim); font-style:italic; margin-top:8px;}
  .sent-shell .btn-primary, .sent-shell .btn-ghost{max-width:340px;}

  /* ---------- sheet / modal ---------- */
  .sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:40;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    max-width:640px; margin:0 auto; background:var(--surface);
    border-radius:18px 18px 0 0; padding:20px 18px 24px 18px;
    max-height:85vh; overflow-y:auto; border-top:1px solid var(--border);
  }
  .sheet-handle{width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 16px auto;}
  .onboard-overlay{
    position:fixed; inset:0; z-index:55; background:var(--bg);
    display:flex; flex-direction:column; justify-content:center;
    padding:40px 26px; overflow-y:auto; max-width:640px; margin:0 auto;
  }
  .onboard-mark{font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--brass); margin-bottom:10px;}
  .onboard-overlay h2{font-size:28px; letter-spacing:0.5px; margin:0 0 26px 0; color:var(--text);}
  .onboard-overlay p{font-size:16px; line-height:1.55; color:var(--text); margin:0 0 18px 0;}
  .onboard-overlay p strong{color:var(--brass);}
.onboard-overlay .onboard-note{color:var(--text-dim); font-size:14px;}
  .onboard-overlay .btn-primary{margin-top:18px;}
  .members-banner{
    position:relative; isolation:isolate; overflow:hidden; min-height:132px; box-sizing:border-box;
    width:100%; padding:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(122px,42%);
    align-items:stretch; text-align:left; border:1px solid rgba(150,189,13,0.72); border-radius:4px;
    background:
      radial-gradient(circle at 15% 0%, rgba(102,45,145,0.5), transparent 52%),
      linear-gradient(120deg, #17101D 0%, #130A1A 58%, #08070A 100%);
    box-shadow:inset 4px 0 0 var(--site-green), 0 10px 28px rgba(0,0,0,0.28);
    margin-bottom:4px; margin-top:0;
  }
  .members-banner::before{
    content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; opacity:0.28;
    background:repeating-linear-gradient(-13deg, transparent 0 12px, rgba(255,255,255,0.035) 12px 13px);
  }
  .members-banner .mb-text{min-width:0; align-self:center; padding:17px 4px 17px 18px;}
  .members-banner .mb-kicker{
    display:block; margin-bottom:5px; color:var(--site-green); font-family:'gamay-narrow','Oswald',sans-serif;
    font-size:10px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase;
  }
  .members-banner .mb-title{
    display:block; max-width:230px; color:#F3F0F4; font-family:'modesto-poster',Georgia,serif;
    font-size:22px; font-weight:400; line-height:0.98; letter-spacing:0.01em;
  }
  .members-banner .mb-price{

function mkDrinks(catId, priceLabels, rows){
  return rows.map(r=>{
    const [plu, name, abv, ...prices] = r;
    return { id: catId+'-'+(plu||uid()), plu, name, abv: abv||'', desc:'',
      prices: priceLabels.map((lbl,i)=> ({label:lbl, value: prices[i]==null?'':prices[i]})).filter(p=>p.value!=='') };
  });
}
function mkPours(catId, rows){
  return rows.map(r=>{
    const [plu, name, desc, ...prices] = r;
    const labels = prices.length>1 ? ['Glass','Pitcher'] : ['Price'];
    return { id: catId+'-'+(plu||uid()), plu, name, abv:'', desc,
      prices: labels.map((lbl,i)=>({label:lbl, value:prices[i]})) };
  });
}
function mkWine(rows){
  return rows.map(r=>{

async function loadAll(){
  try{
    const snap = await menuDocRef.get();
    if(snap.exists){ menu = JSON.parse(snap.data().json); }
    else { menu = defaultMenu(); await menuDocRef.set({ json: JSON.stringify(menu), updatedAt: Date.now() }); }
  }catch(e){ console.error(e); menu = defaultMenu(); }
  if(!activeCat && menu.categories.length){ activeCat = menu.categories[0].id; }
  loaded = true;
  if(typeof location!=='undefined' && location.hash==='#bar'){
    location.hash = '';
    openStaffArea('bar');
  }
  render();
  menuDocRef.onSnapshot(snap=>{
    if(!snap.exists) return;
    const incoming = snap.data().json;
    if(incoming !== JSON.stringify(menu)){ menu = JSON.parse(incoming); render(); }
  });
}
async function saveMenu(msg){
  try{
    await menuDocRef.set({ json: JSON.stringify(menu), updatedAt: Date.now() });
    showToast(msg||'Saved');
    backupMenu(msg);
  }
  catch(e){ console.error(e); showToast('Could not save — check connection'); }
}

// Best-effort snapshot after every successful save. Never blocks or fails
// the actual save above — if a backup write fails, the live menu is still
// safe, we just miss one restore point.
async function backupMenu(label){
  try{
    await backupsCollectionRef.doc(String(Date.now())).set({
      json: JSON.stringify(menu), savedAt: Date.now(), label: label || 'Save'
    });
    pruneOldBackups();
  }catch(e){}
}
async function pruneOldBackups(){
  try{
    const snap = await backupsCollectionRef.orderBy('savedAt','desc').get();
    const extra = snap.docs.slice(MAX_BACKUPS);
    await Promise.all(extra.map(d=>d.ref.delete()));
  }catch(e){}
}

let backupsList = [];
let backupsLoaded = false;
let backupsPanelOpen = false;
async function loadBackups(){
  try{
    const snap = await backupsCollectionRef.orderBy('savedAt','desc').limit(MAX_BACKUPS).get();
    backupsList = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  }catch(e){ backupsList = []; }
  backupsLoaded = true;
  render();
}
function toggleBackupsPanel(){
  backupsPanelOpen = !backupsPanelOpen;
  if(backupsPanelOpen && !backupsLoaded) loadBackups();
  render();
}
function fmtBackupTime(ts){
  return new Date(ts).toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}
async function restoreBackup(id){
  const b = backupsList.find(x=>x.id===id);
  if(!b) return;
  const when = fmtBackupTime(b.savedAt);
  if(!confirm('Restore the menu to the backup from '+when+'? This overwrites everything currently on the menu.')) return;
  try{
    menu = JSON.parse(b.json);
    backupsPanelOpen = false;
    await saveMenu('Restored from backup ('+when+')');
  }catch(e){ showToast('Restore failed — check connection'); }
}

  if(!tableSlug || !tableOrder) return;

}

function startTablePolling(){
  stopTablePolling();
  tablePollId = ordersCollectionRef.doc(tableSlug).onSnapshot(snap=>{
    if(!snap.exists) return;
    const fresh = snap.data();
    if(JSON.stringify(fresh)!==JSON.stringify(tableOrder)){ tableOrder = fresh; render(); }
  });
}
function stopTablePolling(){ if(tablePollId){ tablePollId(); tablePollId=null; } }

function startBarPolling(){
  stopBarPolling();
  barPollId = ordersCollectionRef.onSnapshot(snap=>{
    const out = [];
    // The bar should only ever see orders the customer has actually sent —
    // in-progress carts stay private until "Send to Bar" is confirmed.
    snap.forEach(doc=>{ const d = doc.data(); if(d.sent) out.push(d); });
    out.sort((a,b)=> (a.sentAt||a.updatedAt||0)-(b.sentAt||b.updatedAt||0));
    barOrders = out;
    render();
  });
}
function stopBarPolling(){ if(barPollId){ barPollId(); barPollId=null; } }

function money(v){ return '£'+Number(v).toFixed(2); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  toastMsg = msg; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toastMsg=''; render(); }, 2200);
}

// Staff footer (Liqueurs tab only) calls this for all three staff actions.
// If already authed this visit, it jumps straight there; otherwise it shows
// the shared PIN screen and remembers which area to open on success.
function openStaffArea(target){
  pendingStaffTarget = target;
  if(staffAuthed){ enterStaffArea(target); return; }
  mode = 'pin'; pinEntry = ''; render();
}
function enterStaffArea(target){
  if(target==='bar'){ enterBarMode(); return; }
  mode = target; render();
}
function tryPinDigit(d){
  if(pinEntry.length>=4) return;
  pinEntry += String(d);
  if(pinEntry.length===4){
    if(pinEntry===MASTER_PIN){
      staffAuthed = true; pinEntry = '';
      showToast('Staff access granted');
      const target = pendingStaffTarget || 'edit';
      if(target==='edit') syncNewMenuItems(true);
      enterStaffArea(target);
    } else { showToast('Wrong PIN'); pinEntry=''; render(); }
  } else render();
}
function pinClear(){ pinEntry=''; render(); }
function cancelPin(){ mode='browse'; pinEntry=''; pendingStaffTarget=null; render(); }
// Just returns to the customer view — staffAuthed stays true, so hopping
// straight to one of the other two staff areas from the footer doesn't ask
// for the PIN again this visit.
function exitStaffArea(){
  mode = 'browse'; render();
}
// Explicit sign-out — shown in the footer only while staffAuthed is true,
// so staff can lock things back up before handing the device to a customer.
function lockStaffArea(){
  staffAuthed = false; mode = 'browse'; pendingStaffTarget = null;
  showToast('Staff access locked'); render();
}

function syncNewMenuItems(silent){
  const fresh = defaultMenu();
  const freshByPlu = {};
  fresh.categories.forEach(fc=> fc.items.forEach(fi=>{ if(fi.plu) freshByPlu[fi.plu] = fi; }));

  const existingPlus = new Set();
  menu.categories.forEach(cat=> cat.items.forEach(it=>{ if(it.plu) existingPlus.add(it.plu); }));
  let added = 0;
  fresh.categories.forEach(freshCat=>{
    freshCat.items.forEach(freshItem=>{
      if(freshItem.plu && existingPlus.has(freshItem.plu)) return; // already on the menu, leave it alone
      let cat = menu.categories.find(c=>c.id===freshCat.id);
      if(!cat){
        cat = { id: freshCat.id, name: freshCat.name, items: [] };
        if(freshCat.wheel) cat.wheel = true;
        if(freshCat.mixable) cat.mixable = true;
        if(freshCat.hiddenGroups) cat.hiddenGroups = [...freshCat.hiddenGroups];
        menu.categories.push(cat);
      }
      cat.items.push(freshItem);
      if(freshItem.plu) existingPlus.add(freshItem.plu);
      added++;
    });
  });
  // Repair pass: force every plu-backed item's id to the deterministic
  // catId+plu form. Older builds assigned ids from a counter that reset on
  // every menu rebuild, so a new item could silently land on the exact same
  // id as an unrelated older one — tapping "+" would then add whichever
  // item that id pointed to first, not the one actually tapped. This can't
  // recur once ids are plu-based, and this pass fixes any item still
  // carrying an old colliding id from before this fix existed.
  let fixed = 0;
  menu.categories.forEach(cat=>{
    cat.items.forEach(item=>{
      if(item.plu){
        const correctId = cat.id+'-'+item.plu;
        if(item.id !== correctId){ item.id = correctId; fixed++; }
      }
    });
  });
  // Fill in any blank ABV on existing items from the latest menu code —
  // only ever fills a blank, never overwrites a value already set, so it
  // can't stomp on a deliberate edit.
  let abvFilled = 0;
  menu.categories.forEach(cat=>{
    cat.items.forEach(item=>{
      if(item.plu && !item.abv){
        const fi = freshByPlu[item.plu];
        if(fi && fi.abv){ item.abv = fi.abv; abvFilled++; }
      }
    });
  });
  // Backfill member-tab metadata (memberGroup, isMember, isMembershipCard,
  // hiddenGroups) on items/categories that already existed before this
  // grouping was added — same reasoning as the ABV fill above: items that
  // already exist by plu are never touched by the "add new items" pass, so
  // a purely structural field like this needs its own explicit backfill or
  // it silently never arrives on a menu that's already been synced once.
  let memberMetaFixed = 0;
  menu.categories.forEach(cat=>{
    cat.items.forEach(item=>{
      const fi = item.plu ? freshByPlu[item.plu] : null;
      if(!fi) return;
      let changed = false;
      if(fi.memberGroup && item.memberGroup !== fi.memberGroup){ item.memberGroup = fi.memberGroup; changed = true; }
      if(fi.isMember && !item.isMember){ item.isMember = true; changed = true; }
      if(fi.isMembershipCard && !item.isMembershipCard){ item.isMembershipCard = true; changed = true; }
      if(changed) memberMetaFixed++;
    });
    if(cat.id==='members' && !Array.isArray(cat.hiddenGroups)){ cat.hiddenGroups = []; }
  });
  if(added>0 || fixed>0 || abvFilled>0 || memberMetaFixed>0){
    const parts = [];
    if(added>0) parts.push(added+' new item'+(added===1?'':'s')+' added');
    if(fixed>0) parts.push(fixed+' item link'+(fixed===1?'':'s')+' repaired');
    if(abvFilled>0) parts.push(abvFilled+' ABV'+(abvFilled===1?'':'s')+' filled in');
    if(memberMetaFixed>0) parts.push(memberMetaFixed+' item'+(memberMetaFixed===1?'':'s')+' regrouped');
    saveMenu(parts.join(', '));
  } else if(!silent){ showToast('Menu already up to date'); render(); }
}

function spiritWheelSelectedIndex(){
  const items=wheelItems();
  if(!items.length) return null;
  const TAU=Math.PI*2;
  const pointerAngle=Math.PI; // 9 o'clock
  const slice=TAU/items.length;
  const base=pointerAngle-slice/2;
  let local=(pointerAngle-base-wheelRotation)%TAU;
  if(local<0) local+=TAU;
  return Math.floor(local/slice)%items.length;
}


function spiritWheelTickIndex(){

function spiritWheelHapticTick(force){

  if(now-wheelLastHapticAt < minGap) return;
  wheelLastHapticAt=now;
  const duration = force < 0.02 ? 7 : force < 0.05 ? 10 : 13;

}

function drawSpiritWheel(){
  const canvas=document.getElementById('spirit-wheel-canvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const items=wheelItems();
  if(!items.length) return;

  const TAU=Math.PI*2;
  const pointerAngle=Math.PI;
  const cx=360, cy=360, radius=329;
  const slice=TAU/items.length;
  const base=pointerAngle-slice/2;

  ctx.clearRect(0,0,720,720);

  function wrapText(value,x,y,maxWidth,lineHeight){
    const words=String(value||'').toUpperCase().split(/\s+/);
    const lines=[]; let line='';
    words.forEach(word=>{
      const test=line ? line+' '+word : word;
      if(ctx.measureText(test).width>maxWidth && line){ lines.push(line); line=word; }
      else line=test;
    });
    if(line) lines.push(line);
    const shown=lines.slice(0,3);
    const startY=y-((shown.length-1)*lineHeight)/2;
    shown.forEach((ln,i)=>ctx.fillText(ln,x,startY+i*lineHeight));
  }

  items.forEach((item,i)=>{
    const start=base+wheelRotation+i*slice;
    const finish=start+slice;
    const mid=start+slice/2;
    const chosen=i===wheelResultIndex;

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,radius,start,finish);
    ctx.closePath();
    ctx.fillStyle=chosen ? '#5B2A73' : (i%2===0 ? '#080708' : '#F0ECEE');
    ctx.fill();
    ctx.strokeStyle='#5B2A73';
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx+Math.cos(mid)*208, cy+Math.sin(mid)*208);

    // Painted-on-board orientation:
    // 9 o'clock is upright; 3 o'clock is upside down.
    ctx.rotate(mid + Math.PI);

    ctx.fillStyle=chosen ? '#FFFFFF' : (i%2===0 ? '#F3EFF1' : '#090809');
    ctx.font="600 20px 'Oswald', Arial, sans-serif";
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    wrapText(item.name,0,0,148,21);
    ctx.restore();
  });

  ctx.beginPath();
  ctx.arc(cx,cy,radius,0,TAU);
  ctx.strokeStyle='#050405';
  ctx.lineWidth=12;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx,cy,radius-7,0,TAU);
  ctx.strokeStyle='#5B2A73';
  ctx.lineWidth=4;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx,cy,88,0,TAU);
  ctx.fillStyle='#080708';
  ctx.fill();
  ctx.strokeStyle='#5B2A73';
  ctx.lineWidth=3;
  ctx.stroke();
}

function initSpiritWheel(){
  const canvas=document.getElementById('spirit-wheel-canvas');
  const centre=document.getElementById('spirit-wheel-centre');
  if(!canvas || !centre) return;

  drawSpiritWheel();
  wheelLastTickIndex=spiritWheelTickIndex();
  updateSpiritWheelResult();

  const TAU=Math.PI*2;
  const friction=0.986;
  const stopVelocity=0.00042;

  function shortDelta(a,b){
    let d=a-b;
    while(d>Math.PI)d-=TAU;
    while(d<-Math.PI)d+=TAU;
    return d;
  }

  function pointerAngle(e){
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)/rect.width*720;
    const y=(e.clientY-rect.top)/rect.height*720;
    return Math.atan2(y-360,x-360);
  }

  function finishSpin(){
    wheelVelocity=0;
    wheelSpinning=false;
    wheelRaf=null;
    wheelResultIndex=spiritWheelSelectedIndex();
    drawSpiritWheel();
    updateSpiritWheelResult();
    if('vibrate' in navigator){
      try{ navigator.vibrate([18,35,24]); }catch(e){}
    }
  }

  function animate(){
    if(wheelDragging) return;
    wheelRotation+=wheelVelocity;
    wheelVelocity*=friction;
    maybeSpiritWheelTick();
    drawSpiritWheel();

    if(Math.abs(wheelVelocity)>stopVelocity){
      wheelRaf=requestAnimationFrame(animate);
    }else{
      finishSpin();
    }
  }

  function beginInertia(){
    if(wheelRaf) cancelAnimationFrame(wheelRaf);
    wheelResultIndex=null;
    wheelSpinning=true;
    updateSpiritWheelResult();

    if(Math.abs(wheelVelocity)<0.012){
      wheelVelocity+=(Math.random()>.5?1:-1)*0.018;
    }
    animate();
  }

  canvas.addEventListener('pointerdown',e=>{
    if(wheelRaf) cancelAnimationFrame(wheelRaf);
    wheelRaf=null;
    wheelSpinning=false;
    wheelDragging=true;
    wheelVelocity=0;
    wheelResultIndex=null;
    wheelLastAngle=pointerAngle(e);
    wheelLastTime=performance.now();
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    updateSpiritWheelResult();
    drawSpiritWheel();
  });

  canvas.addEventListener('pointermove',e=>{
    if(!wheelDragging) return;
    const now=performance.now();
    const a=pointerAngle(e);
    const d=shortDelta(a,wheelLastAngle);
    const dt=Math.max(8,now-wheelLastTime);
    wheelRotation+=d;
    const instantaneous=d*(16.67/dt);
    wheelVelocity=wheelVelocity*0.36+instantaneous*0.64;
    maybeSpiritWheelTick();
    wheelLastAngle=a;
    wheelLastTime=now;
    drawSpiritWheel();
  });

  function release(){
    if(!wheelDragging) return;
    wheelDragging=false;
    wheelVelocity=Math.max(-0.34,Math.min(0.34,wheelVelocity));
    beginInertia();
  }

  canvas.addEventListener('pointerup',release);
  canvas.addEventListener('pointercancel',release);

  centre.addEventListener('click',()=>{
    if(wheelRaf) cancelAnimationFrame(wheelRaf);
    wheelDragging=false;
    wheelVelocity=(Math.random()>.5?1:-1)*(0.16+Math.random()*0.11);
    beginInertia();
  });
}

function findItemById(id){
  for(const cat of menu.categories){
    const item = cat.items.find(i=>i.id===id);

  return null;
}
function searchAllItems(q){
  q = q.trim().toLowerCase();
  const results = [];
  menu.categories.forEach(cat=>{
    cat.items.forEach(item=>{
      if(item.name.toLowerCase().includes(q) || (item.desc||'').toLowerCase().includes(q)){
        results.push({ item, catName: cat.name });
      }
    });
  });
  return results;
}

function render(){
  const app = document.getElementById('app');
  if(!loaded){ app.innerHTML = '<div style="padding:60px 20px; text-align:center; color:#A79AA6;">Loading menu…</div>'; return; }
  if(barActive){ app.innerHTML = renderBarScreen(); return; }
  if(sentScreenOpen){ app.innerHTML = renderSentScreen(); return; }

  const prevCatScroll = document.querySelector('.cat-scroll');
  const catScrollX = prevCatScroll ? prevCatScroll.scrollLeft : 0;
  const prevSearchInput = document.getElementById('search-input');
  const searchFocused = !!(prevSearchInput && document.activeElement === prevSearchInput);
  const searchSelStart = searchFocused ? prevSearchInput.selectionStart : null;
  const searchSelEnd = searchFocused ? prevSearchInput.selectionEnd : null;
  const showStaffLinks = activeCat === 'liqueurs';

  let html = '';
  html += toastMsg ? `<div class="toast">${escapeHtml(toastMsg)}</div>` : '';

      <div>
        <img class="brand-logo" src="Banshee logo.jpg" alt="The Banshee Labyrinth">
      </div>
      </div>

  html += '<main>';

    : mode==='pin' ? renderPinScreen()
    : mode==='edit' ? renderEditView()
    : mode==='86' ? render86View()
    : renderBrowseView();
  html += '</main>';

  if(mode==='browse' && tableOrder && tableOrder.items.length && !orderSheetOpen){
    html += `<div class="order-bar"><div class="order-bar-inner" onclick="openOrderSheet()">
      <span>${escapeHtml(tableLabel)} · ${orderCount()} item${orderCount()!==1?'s':''} · ${money(orderTotal())}</span>
      <button class="cta" onclick="event.stopPropagation(); openOrderSheet()">View order</button>
    </div></div>`;
  }

  if(showStaffLinks){
    html += `<footer class="staff-footer">
      <p class="staff-footer-label">Staff tools · master PIN required</p>
      <div class="staff-footer-actions">
        <button class="staff-btn ${mode==='edit'?'active':''}" onclick="openStaffArea('edit')">Edit Menu</button>
        <button class="staff-btn ${mode==='86'?'active':''}" onclick="openStaffArea('86')">86 List</button>
        <button class="staff-btn ${barActive?'active':''}" onclick="openStaffArea('bar')">Bar Board</button>
      </div>
      ${staffAuthed ? `<button class="staff-lock-btn" onclick="lockStaffArea()">Lock staff access</button>` : ''}
    </footer>`;
  }

  if(wheelOpen){ html += renderWheelSheet(); }
  if(itemSheetOpen){ html += renderItemSheet(); }
  if(onboardingOpen){ html += renderOnboardingSheet(); }
  if(memberPromptOpen && memberPromptItem){ html += renderMemberPromptSheet(); }
  if(joinSheetOpen){ html += renderJoinSheet(); }
  if(quickAddItem){ html += renderQuickAddSheet(); }
  if(sendConfirmOpen){ html += renderSendConfirmSheet(); }
  else if(orderSheetOpen){ html += renderOrderSheet(); }
  if(dashPromptOpen && dashPromptItem){ html += renderDashSheet(); }
  if(icePromptOpen && icePromptItem){ html += renderIcePromptSheet(); }

  app.innerHTML = html;

  const newCatScroll = document.querySelector('.cat-scroll');
  if(newCatScroll && catScrollX){ newCatScroll.scrollLeft = catScrollX; }
  if(wheelOpen){ initSpiritWheel(); }

  if(searchFocused){
    const newSearchInput = document.getElementById('search-input');
    if(newSearchInput){
      newSearchInput.focus();
      if(searchSelStart != null && typeof newSearchInput.setSelectionRange === 'function'){
        try{ newSearchInput.setSelectionRange(searchSelStart, searchSelEnd); }catch(e){}
      }
    }
  }
}

    const results = searchAllItems(query);
    if(!results.length) h += `<div class="empty-state">Nothing matches your search.</div>`;

function renderMembersGrouped(cat){
  let h = '';
  const hidden = cat.hiddenGroups || [];
  const card = cat.items.find(i=>i.isMembershipCard);
  if(card) h += itemCardHtml(card);
  const GROUP_ORDER = ['Draught','Bottles','Spirits','Cocktails','Shots'];
  GROUP_ORDER.forEach(group=>{
    if(hidden.includes(group)) return;
    const groupItems = cat.items.filter(i=>i.memberGroup===group);

    h += `<h3 class="member-group-heading">${escapeHtml(group)}</h3>`;
    groupItems.forEach(it=>{ h += itemCardHtml(it); });
  });
  return h;

    <div class="sheet-handle"></div>
    <h2 style="font-size:16px; margin:0 0 12px 0;">${escapeHtml(tableLabel)}'s Order</h2>`;
  if(!tableOrder || !tableOrder.items.length){
    h += `<div class="empty-state">Nothing added yet.</div>`;
  } else {
    tableOrder.items.forEach(l=>{
      h += `<div class="order-line ${l.isMember?'mem-highlight':''}">
        <div class="oinfo">
          <div class="oname">${escapeHtml(l.name)}${l.isMember?'<span class="member-badge">Member</span>':''}${l.variant?`<span class="ovariant"> · ${escapeHtml(l.variant)}</span>`:''}${l.ice?` <span class="ovariant">· ${escapeHtml(l.ice)}</span>`:''}${l.forName?` <span class="ovariant">· for ${escapeHtml(l.forName)}</span>`:''}</div>
          <div class="oprice">${money(l.price)} each</div>
        </div>
        <div class="qty-ctrl">
          <button onclick="changeOrderQty('${l.lineKey}',-1)">−</button>
          <span class="qnum">${l.qty}</span>
          <button onclick="changeOrderQty('${l.lineKey}',1)">+</button>
        </div>
      </div>`;
    });
    h += `<label class="field-label">Notes for the bar (optional)</label>
    <textarea placeholder="Allergies, no ice, etc." oninput="setOrderNotes(this.value)" onblur="saveOrderNotesNow()">${escapeHtml(tableOrder.notes||'')}</textarea>
    <div class="total-row"><span>Total</span><span class="amt">${money(orderTotal())}</span></div>`;
    if(tableOrder.sent){
      h += `<p style="font-size:12px; color:var(--success); margin-top:10px; line-height:1.5;">
        ✓ Sent to the bar — they're on it. Anything you add now will update live on their screen.
      </p>`;
    } else {
      h += `<p style="font-size:12px; color:var(--text-dim); margin-top:10px; line-height:1.5;">
        Add everything you want, then send it through when you're ready — the bar
        only sees it once you send.
      </p>
      <button class="btn-primary" style="width:100%; margin-top:4px;" onclick="askSendOrder()">Send to Bar</button>`;
    }
    h += `<button class="btn-danger" onclick="clearOrder()">Clear whole order</button>`;
  }
  h += `<button class="btn-secondary" onclick="closeOrderSheet()">Keep browsing</button></div>`;
  return h;
}

function renderSendConfirmSheet(){
  return `<div class="sheet-backdrop" onclick="cancelSendOrder()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 style="font-size:16px; margin:0 0 8px 0;">Send this order to the bar?</h2>
    <p style="font-size:12.5px; color:var(--text-dim); margin:0 0 16px 0; line-height:1.5;">
      The bar will see it on their screen and start on it. You can still add
      more to it afterwards if you need to.
    </p>
    <button class="btn-primary" style="width:100%;" onclick="confirmSendOrder()">Yes, send it</button>
    <button class="btn-ghost" onclick="cancelSendOrder()">No, keep editing</button>
  </div>`;
}

function renderSentScreen(){
  const snap = lastSentSnapshot;
  const count = snap ? snap.items.reduce((s,l)=>s+l.qty,0) : 0;
  // Most group names are a word or two and should read as BIG as possible;
  // scale down gracefully for the rare long one instead of overflowing.
  const len = (tableLabel||'').length;
  const nameSize = len > 24 ? '30px' : len > 16 ? '42px' : len > 10 ? '56px' : null;

  let breakdown = '';
  if(snap && snap.items.length){
    breakdown = `<div class="sent-breakdown">` + snap.items.map(l=>
      `<div class="sent-item-line"><span><span class="sqty">${l.qty}×</span> ${escapeHtml(l.name)}${l.variant?` — ${escapeHtml(l.variant)}`:''}${l.ice?` — ${escapeHtml(l.ice)}`:''}${l.forName?` <span class="sfor">for ${escapeHtml(l.forName)}</span>`:''}</span><span>${money(l.price*l.qty)}</span></div>`
    ).join('') + (snap.notes ? `<div class="sent-item-note">Note: ${escapeHtml(snap.notes)}</div>` : '') + `</div>`;
  }

  return `<div class="sent-shell">
    <div class="sent-check">✓</div>
    <p class="sent-eyebrow">Order Sent</p>
    <p class="sent-instruction">Please make your way to the bar</p>
    <h1 class="sent-groupname"${nameSize?` style="font-size:${nameSize};"`:''}>${escapeHtml(tableLabel)}</h1>
    ${count ? `<p class="sent-sub">${count} item${count===1?'':'s'} · ${money(snap.total)}</p>` : ''}
    ${breakdown}
    <button class="btn-primary" onclick="dismissSentScreen()">Got it</button>
  </div>`;
}


function renderDashSheet(){
  const item = dashPromptItem;
  let h = `<div class="sheet-backdrop" onclick="skipDash()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 style="font-size:16px; margin:0 0 4px 0;">Add a mixer?</h2>
    <p style="font-size:12.5px; color:var(--text-dim); margin:0 0 12px 0;">
      ${escapeHtml(item.name)} is charged neat — a dash of mixer is ${money(DASH_PRICE)} on top, rung up separately.
    </p>
    <div class="variant-row">`;
  DASH_OPTIONS.forEach(d=>{
    h += `<button onclick="addDash('${d.plu}','${escapeHtml(d.name)}')"><span>${escapeHtml(d.name)}</span><span>${money(DASH_PRICE)}</span></button>`;
  });
  h += `</div><button class="btn-ghost" onclick="skipDash()">No mixer, just the spirit</button></div>`;
  return h;
}

function renderIcePromptSheet(){
  const item = icePromptItem;
  return `<div class="sheet-backdrop" onclick="skipIce()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 style="font-size:16px; margin:0 0 4px 0;">${escapeHtml(item.name)}</h2>
    <p style="font-size:12.5px; color:var(--text-dim); margin:0 0 12px 0;">Ice or no ice?</p>
    <div class="variant-row">
      <button onclick="chooseIce('Ice')">Ice</button>
      <button onclick="chooseIce('No Ice')">No Ice</button>
    </div>
    <button class="btn-ghost" onclick="skipIce()">Skip</button>
  </div>`;
}

function renderBarScreen(){
  // Detail drill-down takes over the whole screen when a tile is open.
  const openOrder = barOpenSlug ? barOrders.find(o => (o.slug || slugify(o.displayLabel)) === barOpenSlug) : null;
  if(openOrder) return renderBarDetail(openOrder);

  const count = barOrders.length;
  const slots = Math.max(16, Math.ceil(count/4)*4); // always a full 4-wide grid, extra rows scroll
  const rows = slots/4;
  let tiles = '';
  for(let i=0; i<slots; i++){
    if(i < count){
      const o = barOrders[i];
      const slug = o.slug || slugify(o.displayLabel);
      const sentTs = o.sentAt || o.updatedAt;
      const fresh = (Date.now()-sentTs) < 60000;
      const lineCount = o.items.reduce((s,l)=>s+l.qty,0);
      tiles += `<button class="bar-tile ${fresh?'fresh':''}" onclick="openBarOrder('${slug}')">
        ${fresh?'<span class="btdot"></span>':''}
        <span class="btname">${escapeHtml(o.displayLabel)}</span>
        <span class="btcount">${lineCount} item${lineCount===1?'':'s'} · ${fmtElapsed(sentTs)}</span>
      </button>`;
    } else {
      tiles += `<div class="bar-tile empty"></div>`;
    }
  }

  return `<div class="bar-shell">
    <div class="bar-topbar">
      <h1>Bar Orders${count?` <span class="bar-count">(${count})</span>`:''}</h1>
      <a href="#" onclick="exitBarMode(); return false;" class="bar-exit">Back to menu</a>
    </div>
    ${count ? `<div class="bar-grid" style="grid-template-rows:repeat(${rows}, minmax(22vh,1fr));">${tiles}</div>` : `<div class="empty-state" style="padding:60px 20px;">No active group orders.</div>`}
  </div>`;
}

function renderBarDetail(o){
  const slug = o.slug || slugify(o.displayLabel);
  const sentTs = o.sentAt || o.updatedAt;
  const fresh = (Date.now()-sentTs) < 60000;
  const total = o.items.reduce((s,l)=>s+l.price*l.qty,0);
  let lines = '';
  o.items.forEach(l=>{
    lines += `<div class="bar-line ${l.isMember?'mem-highlight':''}"><span><span class="bqty">${l.qty}×</span>${escapeHtml(l.name)}${l.isMember?'<span class="member-badge">Member</span>':''}${l.variant?' — '+escapeHtml(l.variant):''}${l.ice?' — '+escapeHtml(l.ice):''}${l.forName?' <span class="bar-for">for '+escapeHtml(l.forName)+'</span>':''}</span><span>${money(l.price*l.qty)}</span></div>`;
  });

  return `<div class="bar-shell">
    <div class="bar-topbar">
      <h1>${escapeHtml(o.displayLabel)}</h1>
      <span class="bar-exit" style="text-decoration:none;">${fresh?'Sent just now':'Sent '+fmtElapsed(sentTs)}</span>
    </div>
    <div class="bar-detail-body">
      <div id="bar-print-area" class="bar-print-area">
        <div class="bar-print-head">
          <div class="bar-print-title">${escapeHtml(o.displayLabel)}</div>
          <div class="bar-print-time">${new Date(sentTs).toLocaleString('en-GB')}</div>
        </div>
        ${lines}
        ${o.notes ? `<div class="bar-notes">Note: ${escapeHtml(o.notes)}</div>` : ''}
        <div class="bar-total"><span>Total</span><span>${money(total)}</span></div>
      </div>
    </div>
    <div class="bar-detail-actions">
      <button class="bar-action-btn bar-action-print" onclick="printBarOrder()">Print</button>
      <button class="bar-action-btn bar-action-clear" onclick="markServed('${slug}')">Clear</button>
      <button class="bar-action-btn bar-action-return" onclick="closeBarOrder()">Return</button>
    </div>
  </div>`;
}

// Lets a plain mouse wheel scroll the category tab row horizontally on
// desktop, where there's no touch-swipe and no visible affordance otherwise.
// Attached once to #app (never destroyed by re-renders) rather than to
// .cat-scroll itself (which gets recreated on every render).
document.getElementById('app').addEventListener('wheel', function(e){
  const catScroll = e.target.closest('.cat-scroll');
  if(!catScroll) return;
  if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
    catScroll.scrollLeft += e.deltaY;
    e.preventDefault();
  }
}, { passive: false });

loadAll();
</script>
